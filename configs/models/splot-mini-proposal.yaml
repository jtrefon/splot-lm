# Illustrative research configuration; not executable yet.
model:
  vocab_size: 32768
  hidden_size: 768
  prelude_layers: 2
  recurrent_layers: 4
  coda_layers: 2
  recurrence:
    min_loops: 1
    max_loops: 4
    default_loops: 2
    input_injection: true
    adaptive_halting: false
  attention:
    core_pattern: [gated_deltanet, gated_deltanet, gated_deltanet, gated_gqa]
    num_attention_heads: 12
    num_kv_heads: 4
    head_dim: 64
    rope_theta: 1000000
  moe:
    enabled_in: recurrent_core
    num_routed_experts: 8
    num_shared_experts: 1
    experts_per_token: 2
    expert_intermediate_size: 1024
    dense_intermediate_size: 2048
    router_dtype: float32
  normalization: rmsnorm
  activation: swiglu
  tie_embeddings: true
  mtp:
    enabled: true
    prediction_depth: 2
    strategy: intermediate_ce_candidate
training:
  precision: bf16
  optimizer: adamw
  gradient_checkpointing: true
  sequence_length: 2048
  fp8_training: false
  expert_locality_loss: false
  quantization_aware_training: false
