# RFC 0001 v0.2 candidate; not executable model configuration yet.
model:
  vocab_size: 32768
  hidden_size: 384
  prelude_layers: 2
  recurrent_layers: 4
  coda_layers: 2
  recurrence:
    min_loops: 1
    max_loops: 4
    default_loops: 2
    # RFC 0002: I0 reference, I1/I2 experimental
    input_injection: false
    input_injection_variant: none
    residual_scale: unscaled
    adaptive_halting: false
  attention:
    core_pattern: [gated_deltanet, gated_deltanet, gated_deltanet, gated_gqa]
    num_attention_heads: 6
    num_kv_heads: 2
    head_dim: 64
    rope_theta: 1000000
    prelude_mixer: gqa
    coda_mixer: gqa
    core_gqa_output_gate: sigmoid
    gdn:
      key_heads: 6
      value_heads: 6
      key_head_dim: 64
      value_head_dim: 64
      conv_kernel_size: 4
      qk_l2_eps: 1.0e-6
      state_dtype: float32
      history_dtype: bfloat16
  moe:
    enabled_in: recurrent_core
    num_routed_experts: 8
    num_shared_experts: 1
    experts_per_token: 2
    expert_intermediate_size: 512
    dense_intermediate_size: 1024
    router_dtype: float32
    balance_loss_weight: 0.01
  normalization: rmsnorm
  rms_norm_eps: 1.0e-5
  activation: swiglu
  tie_embeddings: true
  mtp:
    enabled: true
    prediction_depth: 2
    strategy: shared_offset2_projection
    ntp_readouts: all_depths
    offset2_readouts: first_and_final_unique
    depth_loss_weight: 0.25
    offset2_loss_weight: 0.25
training:
  precision: bf16
  optimizer: adamw
  gradient_checkpointing: true
  sequence_length: 2048
  fp8_training: false
  expert_locality_loss: false
  quantization_aware_training: false
